[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchbook-api"
version = "0.0.0"
description = "FastAPI service. Stitch logic comes from the digitizer package."
requires-python = ">=3.11"
dependencies = [
  "stitchbook-digitizer",
  "fastapi",
  "uvicorn[standard]",
  "redis",
  "rq",
  "python-multipart",
  "pillow",
  "httpx",          # calls to Supabase (Auth keys, database REST API, Storage)
  "PyJWT[crypto]",  # checks Supabase sign-in tokens (ES256/RS256)
]

[tool.setuptools.packages.find]
where = ["src"]
