[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchbook-api"
version = "0.0.0"
description = "FastAPI service. Stitch logic comes from the digitizer package."
requires-python = ">=3.11"
dependencies = [
  "stitchbook-digitizer",
  "fastapi",
  "uvicorn[standard]",
  "redis",
  "rq",
]

[tool.setuptools.packages.find]
where = ["src"]
