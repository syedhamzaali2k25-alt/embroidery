[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchbook-digitizer"
version = "0.0.0"
description = "Stitch library: logo in, embroidery files and a preview out. No web code."
requires-python = ">=3.11"
dependencies = [
  "pyembroidery",
  "shapely",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "matplotlib",
  "scikit-image",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digitizer = ["data/*.dst"]
