# Stitchbook — the ONE config file for every product number.
#
# Rules (see CLAUDE.md):
#   * Every stitch parameter, size limit, timeout and rate limit lives here, nowhere else.
#   * Each value has a comment saying what it does.
#   * "__CHOOSE__" marks a value the project owner has not chosen yet.
#     digitizer.config refuses to hand out a placeholder, so nothing can
#     silently run on an invented number.
# Units are in the key name: _mm = millimetres, _bytes, _px, _s = seconds.

[app]
# Working product name. The only place it is defined for Python code.
name = "Stitchbook"

[stitch]
# Spacing between parallel rows in a fill (tatami) area. Smaller = denser.
fill_row_spacing_mm = "__CHOOSE__"
# Spacing between the zig-zag passes of a satin column. Smaller = denser.
satin_spacing_mm = "__CHOOSE__"
# Length of each stitch along a running-stitch outline.
running_stitch_length_mm = "__CHOOSE__"
# Longest single stitch the digitizer may emit; longer moves are split.
# Note: the DST format cannot encode a single move longer than 12.1 mm.
max_stitch_length_mm = "__CHOOSE__"
# Stitches shorter than this are merged/dropped (avoids thread build-up and breaks).
min_stitch_length_mm = "__CHOOSE__"
# Row spacing of the underlay laid down before fill and satin top stitching.
underlay_spacing_mm = "__CHOOSE__"
# Amount shapes are widened across the stitch direction to offset fabric pull-in.
pull_compensation_mm = "__CHOOSE__"
# Travel longer than this becomes a jump (or trim) instead of a visible stitch.
jump_threshold_mm = "__CHOOSE__"
# Jumps longer than this also get a trim command.
trim_threshold_mm = "__CHOOSE__"

[input]
# Accepted upload types (from the product spec).
allowed_types = ["png", "jpg", "jpeg", "svg"]
# Largest upload the API accepts.
max_upload_bytes = "__CHOOSE__"
# Raster images larger than this (width or height) are rejected or downscaled.
max_image_side_px = "__CHOOSE__"

[output]
# Formats written today, in priority order (DST first, PES second).
# JEF, VP3 and EXP may be added only after a pyembroidery write-then-read
# round-trip test passes for each one.
formats = ["dst", "pes"]
# Resolution of the preview PNG rendered for each job.
preview_dpi = "__CHOOSE__"

[jobs]
# Hard limit on one digitizing job in the worker before it is killed.
job_timeout_s = "__CHOOSE__"
# How long a finished job's result stays in Redis.
result_ttl_s = "__CHOOSE__"
# How many times a failed job is retried automatically.
max_retries = "__CHOOSE__"

[rate_limits]
# Uploads a single user may start per minute.
uploads_per_minute = "__CHOOSE__"
# Digitizing jobs a single user may have queued or running at once.
concurrent_jobs_per_user = "__CHOOSE__"
